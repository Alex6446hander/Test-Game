openapi: 3.1.0
info:
  title: Quest Service API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /habits/{id}/complete:
    post:
      tags: [public]
      summary: Отметить привычку выполненной
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
          description: Защита от двойного начисления XP при повторном клике.
      responses:
        '200':
          description: Привычка выполнена, события отправлены в брокер.
          content:
            application/json:
              schema:
                type: object
                properties:
                  habitId: { type: string, format: uuid }
                  xpGranted: { type: integer }
                  coinsGranted: { type: integer }
        '409':
          description: Запрос с таким Idempotency-Key уже обработан.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } }

  /habits:
    get:
      tags: [public]
      summary: Получить список привычек с пагинацией
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: size
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: Список привычек.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HabitList' }

  /internal/habits/{id}/revert:
    post:
      tags: [internal]
      summary: Откат выполнения привычки (компенсирующее действие Саги)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, example: "Reward issuance failed" }
                correlationId: { type: string, format: uuid }
      responses:
        '200': { description: Статус привычки возвращен в AVAILABLE }
        '404': 
          description: Привычка не найдена
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } }

components:
  schemas:
    HabitList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Habit' } }
        total: { type: integer }
        page: { type: integer }
        size: { type: integer }
    Habit:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, enum: [AVAILABLE, COMPLETED] }
    ProblemDetail:
      type: object
      properties:
        type: { type: string, format: uri, example: "https://api.rpg-tracker.local/errors/conflict" }
        title: { type: string, example: "Conflict" }
        status: { type: integer, example: 409 }
        detail: { type: string, example: "Действие уже было выполнено." }
    HabitCompletedEvent:
      type: object
      description: Событие публикуется в топик 'quests.events'
      properties:
        eventId: { type: string, format: uuid }
        eventType: { type: string, example: "quest.habit_completed" }
        occurredAt: { type: string, format: date-time }
        payload:
          type: object
          properties:
            habitId: { type: string, format: uuid }
            playerId: { type: string, format: uuid }
            xpReward: { type: integer }
            coinReward: { type: integer }